name: Update pinned repos

on:
  schedule:
    - cron: '23 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-pinned
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'

      - name: Generate pinned JSON
        env:
          # Pinned items need an authenticated GraphQL call. The repo-scoped
          # GITHUB_TOKEN suffices for a public profile (verified 2026-10-26),
          # so PINNED_REPOS_TOKEN is only needed if that ever changes.
          GITHUB_TOKEN: ${{ secrets.PINNED_REPOS_TOKEN || secrets.GITHUB_TOKEN }}
          GH_PINNED_USER: James-HoneyBadger
          GH_PINNED_OUT: data/pinned.json
        run: |
          if [ -z "${GITHUB_TOKEN}" ]; then
            echo "Missing required secret: PINNED_REPOS_TOKEN"
            exit 1
          fi
          node scripts/update-pinned.mjs

      - name: Commit pinned JSON
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/pinned.json
          git commit -m "chore: update pinned repos"
          git push
