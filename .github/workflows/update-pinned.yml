name: Update pinned repos

on:
  schedule:
    - cron: '23 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-pinned
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate pinned JSON
        env:
          # Prefer a PAT if provided; otherwise fall back to the Actions token.
          GITHUB_TOKEN: ${{ secrets.PINNED_REPOS_TOKEN || github.token }}
          GH_PINNED_USER: James-HoneyBadger
          GH_PINNED_OUT: data/pinned.json
        run: node scripts/update-pinned.mjs

      - name: Commit pinned JSON
        run: |
          git status --porcelain
          if [ -z "$(git status --porcelain)" ]; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/pinned.json
          git commit -m "chore: update pinned repos"
          git push
