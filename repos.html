<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>All Repositories | James HoneyBadger</title>
  <meta name="description" content="Search, filter and sort every public repository owned by @James-HoneyBadger. Live data from the GitHub REST API.">
  <link rel="canonical" href="https://james-honeybadger.github.io/repos.html">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="James HoneyBadger">
  <meta property="og:title" content="All Repositories | James HoneyBadger">
  <meta property="og:description" content="Search, filter and sort every public repository owned by @James-HoneyBadger. Live data from the GitHub REST API.">
  <meta property="og:url" content="https://james-honeybadger.github.io/repos.html">
  <meta property="og:image" content="https://james-honeybadger.github.io/hb.jpg">
  <meta property="og:image:alt" content="HoneyBadger graphic">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&display=swap">
  <link rel="stylesheet" href="styles.css">
</head>
<body class="page-repos">
  <div class="shell">
    <header class="hero">
      <p class="tagline">OWNED REPOS ONLY · LIVE FROM GITHUB</p>
      <h1 class="title">Repository directory</h1>
      <p class="subtitle">Search, filter, and sort repositories owned by @James-HoneyBadger. Forks and non-owned repos are excluded.</p>
      <div class="actions">
        <a class="btn secondary" href="index.html">Back to highlights</a>
        <a class="btn" href="https://github.com/James-HoneyBadger" target="_blank" rel="noreferrer">Open GitHub profile</a>
      </div>
    </header>

    <section class="panel">
      <div class="filters">
        <div class="field">
          <label for="search">Search</label>
          <input id="search" type="search" placeholder="Filter by name or description" aria-label="Search repositories">
        </div>
        <div class="field">
          <label for="language">Language</label>
          <select id="language" aria-label="Filter by language">
            <option value="">Any language</option>
          </select>
        </div>
        <div class="field">
          <label for="sort">Sort</label>
          <select id="sort" aria-label="Sort repositories">
            <option value="updated">Recently updated</option>
            <option value="stars">Most stars</option>
            <option value="name">Name (A → Z)</option>
          </select>
        </div>
      </div>

      <div class="status" id="status">Loading repositories…</div>
      <div class="grid" id="repo-grid" aria-live="polite"></div>
    </section>

    <footer>
      <p>Data source: GitHub REST API · Public repositories only.</p>
    </footer>
  </div>

  <script>
    const username = 'James-HoneyBadger';
    const grid = document.getElementById('repo-grid');
    const statusEl = document.getElementById('status');
    const searchInput = document.getElementById('search');
    const langSelect = document.getElementById('language');
    const sortSelect = document.getElementById('sort');

    const state = { repos: [] };
    // Dates are pinned to UTC so every visitor sees the same day as GitHub.
    const dateOptions = { month: 'short', day: 'numeric', year: 'numeric', timeZone: 'UTC' };

    function escapeHtml(str) {
      return str.replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c] || c));
    }

    function setLanguages(repos) {
      const languages = Array.from(new Set(repos.map((r) => r.language).filter(Boolean))).sort();
      languages.forEach((lang) => {
        const opt = document.createElement('option');
        opt.value = lang;
        opt.textContent = lang;
        langSelect.appendChild(opt);
      });
    }

    function render() {
      const term = searchInput.value.trim().toLowerCase();
      const language = langSelect.value;
      const sort = sortSelect.value;

      let list = [...state.repos];

      if (term) {
        list = list.filter((r) => {
          const name = (r.name || '').toLowerCase();
          const desc = (r.description || '').toLowerCase();
          return name.includes(term) || desc.includes(term);
        });
      }

      if (language) {
        list = list.filter((r) => r.language === language);
      }

      if (sort === 'stars') {
        list.sort((a, b) => b.stargazers_count - a.stargazers_count);
      } else if (sort === 'name') {
        list.sort((a, b) => a.name.localeCompare(b.name));
      } else {
        list.sort((a, b) => new Date(b.pushed_at) - new Date(a.pushed_at));
      }

      if (!list.length) {
        statusEl.textContent = 'No repositories match your filters yet.';
        grid.innerHTML = '';
        return;
      }

      statusEl.classList.remove('error');
      statusEl.textContent = '';
      grid.innerHTML = list.map((repo) => {
        const desc = repo.description ? escapeHtml(repo.description) : 'No description provided yet.';
        const lang = repo.language ? `<span class="badge">${escapeHtml(repo.language)}</span>` : '';
        const updated = new Date(repo.pushed_at).toLocaleDateString(undefined, dateOptions);

        return `
          <article class="card">
            <div class="meta">
              <span class="pill">⭐ ${repo.stargazers_count}</span>
              <span class="pill">🍴 ${repo.forks_count}</span>
              ${lang}
            </div>
            <h3><a href="${repo.html_url}" target="_blank" rel="noreferrer">${escapeHtml(repo.name)}</a></h3>
            <p class="desc">${desc}</p>
            <div class="meta">
              <span>Last push · ${updated}</span>
              <span>${repo.private ? 'Private' : 'Public'}</span>
            </div>
          </article>`;
      }).join('');
    }

    async function loadRepos() {
      try {
        const response = await fetch(`https://api.github.com/users/${username}/repos?per_page=100&sort=updated`, {
          headers: { 'Accept': 'application/vnd.github+json' }
        });
        if (!response.ok) {
          throw new Error(`GitHub API error: ${response.status}`);
        }
        const repos = await response.json();
        const owned = Array.isArray(repos)
          ? repos.filter((r) => (r.owner?.login || '').toLowerCase() === username.toLowerCase()).filter((r) => !r.fork)
          : [];
        state.repos = owned;
        setLanguages(owned);
        render();
      } catch (err) {
        statusEl.classList.add('error');
        statusEl.textContent = 'Unable to load repositories right now. Try again shortly or view them directly on GitHub.';
        console.error(err);
      }
    }

    searchInput.addEventListener('input', render);
    langSelect.addEventListener('change', render);
    sortSelect.addEventListener('change', render);

    loadRepos();
  </script>
</body>
</html>
