<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>James HoneyBadger - Adventure Construction Set</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            color: #ffffff;
            line-height: 1.6;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }
        header {
            text-align: center;
            padding: 60px 20px;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 10px;
            margin-bottom: 40px;
        }
        .avatar {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            border: 4px solid #ffd700;
            margin: 0 auto 20px;
            display: block;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.5);
        }
        .name-line {
            font-size: 2.5em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }
        .brand-line {
            font-size: 3em;
            margin-bottom: 20px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
        }
        .brand-line img {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            border: 3px solid #ffd700;
        }
        h1 {
            font-size: 3.5em;
            margin-bottom: 20px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }
        h2 {
            font-size: 2em;
        }
        .subtitle {
            font-size: 1.5em;
            color: #a8d5ff;
            margin-bottom: 30px;
        }
        .hero-buttons {
            margin-top: 30px;
        }
        .btn {
            display: inline-block;
            padding: 15px 30px;
            margin: 10px;
            background: #4CAF50;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            font-size: 1.1em;
            transition: all 0.3s;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        .btn:hover {
            background: #45a049;
            transform: translateY(-2px);
            box-shadow: 0 6px 8px rgba(0,0,0,0.4);
        }
        /* Projects styling */
        .projects-section {
            background: rgba(0, 0, 0, 0.15);
            border-radius: 10px;
            margin-top: 40px;
            padding: 30px 20px;
        }
        .projects-title {
            font-size: 2.2em;
            margin-bottom: 20px;
            color: #ffd700;
            text-align: center;
            text-shadow: 1px 1px 4px rgba(0, 0, 0, 0.4);
        }
        .project-list {
            list-style: none;
            padding: 0;
        }
        .project-item {
            margin-bottom: 22px;
            background: rgba(255,255,255,0.05);
            padding: 18px;
            border-radius: 8px;
            box-shadow: 0 1px 8px rgba(0,0,0,0.08);
            transition: background 0.2s;
        }
        .project-item:hover {
            background: rgba(255,255,224,0.15);
        }
        .project-link {
            font-size: 1.28em;
            font-weight: bold;
            color: #ffd700;
            text-decoration: none;
            transition: color 0.2s;
        }
        .project-link:hover {
            color: #fff300;
            text-decoration: underline;
        }
        .project-desc {
            margin-top: 6px;
            font-size: 1em;
            color: #a8d5ff;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <img src="https://avatars.githubusercontent.com/u/35469007?v=4" alt="James HoneyBadger Avatar" class="avatar" />
            <div class="name-line">James HoneyBadger</div>
            <div class="brand-line">
                <img src="https://avatars.githubusercontent.com/u/35469007?v=4" alt="Brand Logo" />
                Adventure Construction Set
            </div>
            <div class="subtitle">Design | Code | Adventure | Maker | Dreamer</div>
            <div class="hero-buttons">
                <a href="https://github.com/James-HoneyBadger" class="btn">GitHub Profile</a>
                <a href="mailto:your@email.com" class="btn btn-secondary">Contact</a>
            </div>
        </header>
        <!-- Dynamic Projects Section -->
        <section class="projects-section">
            <div class="projects-title">My Projects</div>
            <ul id="project-list" class="project-list">
                <!-- Projects will be loaded here dynamically -->
            </ul>
        </section>
    </div>
    <script>
        async function loadRepos() {
            const repoList = document.getElementById('project-list');
            repoList.innerHTML = '<li>Loading projects...</li>';
            try {
                const response = await fetch('https://api.github.com/users/James-HoneyBadger/repos?per_page=100');
                if (!response.ok) throw new Error("Failed to fetch repos.");
                const repos = await response.json();
                const filtered = repos.filter(r => !r.fork); // hide forks

                if (filtered.length === 0) {
                    repoList.innerHTML = '<li>No public projects found.</li>';
                    return;
                }

                repoList.innerHTML = '';
                filtered.forEach(repo => {
                    const li = document.createElement('li');
                    li.className = 'project-item';
                    li.innerHTML = `
                        <a href="${repo.html_url}" class="project-link" target="_blank" rel="noopener">${repo.name}</a>
                        <div class="project-desc">${repo.description ? repo.description : ''}</div>
                    `;
                    repoList.appendChild(li);
                });
            } catch (err) {
                repoList.innerHTML = '<li>Error loading projects. Please try again later.</li>';
            }
        }
        window.addEventListener('DOMContentLoaded', loadRepos);
    </script>
</body>
</html>
